; EnemyReinforce - settings and menu translations.
;
; The build seeds this file into plugins\EnemyReinforce\ the first
; time only, so later builds never overwrite what you changed in
; game.  The menu writes back here with the Win32 profile calls,
; exactly the way firstperson.ini is written: the value changes in
; place, and the UTF-8 translations below it come through untouched.
; "Remember type" goes to scripthook.ini instead, under
; [EnemyReinforce] type_id_0 .. type_id_4, as hex text.
;
; Item rows are translated in the menu's own scope, which falls
; back to the plain [<lang>] table, so the labels live in [zh_cn].
; The status line under the items needs its printf placeholders
; kept in the same order, so it lives in [zh_cn.Enemy Reinforce].
;
; Exactly one thing starts a wave: the player being HIT by an
; enemy.  Which faction answers is the one selected below.  Nothing
; else is done to them - once spawned, the NPCs are the engine's.

[Settings]
; Waves do not arrive until Active is on.
active = 0
; Faction index: 0 Santa Blanca, 1 Unidad, 2 Rebels, 3 Civilians,
; 4 Special.  Santa Blanca is the usual enemy.  This is the faction
; that answers when the player is hit.
group = 0
; Which archetype of that faction, 1 based, as the spinner counts.
number = 1
; 1 = every wave draws a random archetype out of the current group,
; and the spinner above is then only there to show what it holds.
random = 0
; Seconds between waves, and how many arrive at once.
interval = 8
batch = 3
; Most spawns to count as still in the world.  The cap is measured
; over the last 30 seconds of spawning, because nothing is read back
; to see which of them are still alive.
cap = 8
; How many waves one fight gets.  0 is no limit: they keep coming
; for as long as the player is being shot at.  The budget opens
; again when the hits stop, so this is per fight, not per session.
waves = 0
; How long without being hit counts as the fight being over, in
; seconds.  The wave budget opens again there.
fight_window = 20
; The radius, in metres, inside which an enemy counts as engaging
; the player: it gates the nearby fire trigger and how far the sample
; rows look.  The wave itself is placed ahead of the player, so this
; places nothing.
scan_radius = 120
; 1 = a shot fired at the player from inside that radius counts as
; combat and answers with a wave, exactly as being hit does.  0 keeps
; the rule that only a hit landing on the player waves.
fire_combat = 0
; Index into 10 20 30 50 75 100 metres: how far ahead the batch
; lands.  Default 3 is 50 m.
distance_idx = 3
; 0 Line, 1 Spread, 2 Semicircle, 3 Circle, 4 Random.
formation = 4
; Dump the enemy that shot the player, looking for its archetype id
; inside its own components.  That is the evidence for making the
; returning faction follow the shooter instead of this menu, so it
; is on by default; it stops after a handful of samples.
probe = 1

