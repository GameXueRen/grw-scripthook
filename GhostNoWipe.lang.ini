# GhostNoWipe text: sections are BCP-47 language codes; rows are key = text
[zh-CN]
"Forget the ghost slots" = "清除魅影档标记"
"Ghost save guard" = "魅影模式不删档"
"Keep the save when the run ends" = "死亡后保留存档"
"Stops a Ghost Mode save being wiped when the run ends. Only slots this plugin has seen a Ghost Mode death on are protected; every other slot is left alone." = "魅影模式死亡后不删除存档。仅保护本插件确认过的魅影档，其它档位一律不动。"
"The save was kept - the run is over, and play resumes from the last checkpoint. Restart the game to carry on." = "存档已保住：本次死亡不会丢失存档，退回主菜单/重启游戏后即可继续。"

