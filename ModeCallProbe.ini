; Mode call probe: where the mode selection turns into a mode load.
;
; The engine's objects are reflected - each carries a method table keyed
; by crc32 of the method name - so a method can be looked up and hooked
; by name. This probe dumps those tables for the front end objects and
; runs a dictionary over them, so the function behind the mode selection
; can be found without a disassembler.
;
; Read logs\ModeCallProbe.log after pressing F9 (or F4 -> "Mode call
; probe" -> Dump tables) in the main menu. What to look at first:
;
;   [HIT ]  methods whose recovered name holds mode, session, load,
;           enter, online, pvp, ghost and the like - the short list
;   [NAME]  every method the dictionary could name
;   [M   ]  every method, named or not: index, crc32 and RVA, which is
;           all that is needed to hook one by hash later
;   [OBJ ]  class hash per object, the same numbers ModeProbe prints
;           for its sub objects, so the two logs can be lined up
;
; Nothing is called, hooked or written. Removing the folder undoes it.

[Settings]
; Extra method names to try, comma separated. The built in list is
; verbs x nouns (Enter/Exit/Init/Set/Start/Request/... x Mode/Session/
; Mission/Online/...); anything the engine spells differently goes here
; and is hashed with the same crc32 - for example "SetPlayMode" style
; names the combinations miss. A hit is a real name: a crc32 collision
; would be a misread, not a guess.
names=

; Tripwires. The dictionary named only the scene interface, so the mode
; switch is caught from the other side: the named lifecycle methods are
; hooked, and every call they make is logged with the first four
; arguments and a stack walk ("GRW.exe+0x...", frame by frame). Those
; fire when the front end is rebuilt, which is what entering a mode
; does, and the stack at that moment is the code that decided it - the
; function to hook and read next.
;
; 0 = dump the tables only, hook nothing. hook_names picks which of the
; named methods are armed; the defaults do not run per frame, so the log
; stays readable.
hook=1
hook_names=Init,Shutdown,Enter,Exit

; Hooks picked by address, "RVA[:label]", hex, comma separated - for
; functions a debugger found, which reflection never mentions because
; they belong to plain C++ classes rather than the reflected objects.
;
; The mode manager is exactly that case. SetCurrentGameMode is the one
; that matters: the mode arrives as an ordinary argument there, so its
; RDX is the answer to "which mode is this".
;
;   391E158  GameModeManager::SetCurrentGameMode(this, type, arg2)
;   391E0D0  GameModeManager::CreateGameMode()
;   391E120  GameModeManager::RemoveCurrentGameMode()
;   391E1F0  GameModeManager::OnGameLoadingEnd()
;
; Each address is checked against GRW.exe before it is armed, and one
; that falls outside is logged and skipped - an RVA from another build
; would otherwise put a jump in the middle of unrelated code.
hooks=93B5240:SetGameModeA,93B62F0:SetGameModeB,93AD9D8:CreateGameMode,93B37D0:RemoveCurrentGameMode,93B2870:OnGameLoadingEnd

; A region to read at startup, for a table found by hand: rva and length
; in bytes (dump_rva hex). The mode name table is the short strings
; MP / TG / MERC / SP / COOP at 0x390CCF0, which is how the numbers the
; hooks report get their names. Dumped raw, as pointers, and as packed
; strings. 0 turns it off.
dump_rva=390CCF0
dump_len=256

; Find the code behind a string: rva, hex, comma separated. A RIP
; relative reference to the rva is a lea/mov, and the instruction it
; belongs to is inside whichever function logs that line - which is how
; a class that is not reflected can still be found. Each hit is logged
; with the enclosing function's begin and end, read off the image's
; exception directory (.pdata), so the address to put in hooks= is read
; rather than guessed.
;
; These four are the mode manager's own log lines, and the third is the
; one that matters: SetCurrentGameMode(%u, %u) prints the mode.
ref_rva=391E158,391E0D0,391E120,391E1F0,390CCF0

; 1 = read the game state inside a hook and put it in the [CALL] line.
; Off by default, and not for speed: the mode manager tears its objects
; down around the call this probe is watching, so asking the framework
; for the state from inside that hook walks into a half destroyed one.
; Measured: C0000005 reading FFFFFFFFFFFFFFFF, same thread and
; millisecond as the recorded SetCurrentGameMode call. The registers and
; the stack say everything that is needed, and the memory read through
; ReadProcessMemory cannot fault.
hook_stack=1
