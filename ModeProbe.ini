; ModeProbe - find the play mode, from the outside.
;
; A read only probe: it samples the GameFlow objects, the shell, the
; scene set and the PVP entity names, and writes one line per sample
; to logs\ModeProbe.log.  Nothing is hooked and nothing in the game
; is written.  The build seeds this file next to the .asi the first
; time only, so a later build never overwrites what you changed; the
; plugin writes "enabled" back here with the Win32 profile calls,
; which leave the UTF-8 translations below untouched.
;
; How to read it: play one mode per session (the client restarts when
; a non campaign mode goes back to the menu, so one log file holds
; several sessions - every line carries the process id).  Press the
; dump key (F8) the moment you know which mode you are in, so the log
; has a marked sample to line up with it.
;
; What is being looked for right now: telling the two player versus
; player modes apart from everything else - Ghost War (4v4) and
; MERCENARIES.  Run one session in each of those, plus one PvE
; session as the control - a FOUR PLAYER co-op PvE one is the one
; that matters, since PvE holds several human players too and the
; entity counts alone can not tell the two apart.

[Settings]
; 0 = nothing is sampled at all.
enabled=1

; How often the signature line is written, in ms.
tick_ms=1000

; The raw window over the GameFlow machine and its state object, and
; how often it is written.  0 disables each.  768 bytes covers the
; +0x260 state pointer and the fields around it.
window_ms=5000
window_bytes=768

; The raw window over each GameFlow sub object (slots 0..16).
slot_window_ms=30000
slot_bytes=256

; The PVP entity scan (looks for names carrying "PVP", such as
; PVPHostage and PVPPrisonCell).  It runs on its own thread because
; ShFindEntities reads health for every candidate it keeps.
scan_ms=15000
scan_radius=200

; Watching the files a mode loads.  The [ARC] line is the exact answer:
; the framework's forge I/O layer resolves every archive handle it
; reads to a path and keeps the ledger, so [ARC] lists the .forge files
; this session has really read.  It costs nothing, needs no scan, and
; it is the channel to compare across modes - an archive only one mode
; reads settles which mode this is.  (It is kept installed by
; [forgemod] ledger=1 in scripthook.ini.)
;
; [FILE] below is the fallback for a name that is NOT in the ledger,
; and it is off by default: one scan walks every private page of the
; process, which is about 5 GB and 21 seconds in a loaded session.  0
; means the scan only runs on a dump (F8).
file_scan_ms=0

; The names the memory scan looks for, comma separated.  Empty means no
; scan at all, which is the default.  Keep any list short: every name
; is one more pass over the memory.  Each name is matched both as raw
; text and as UTF-16.  A hit here only proves the string is somewhere
; in memory, not that the file was loaded - the engine builds the path
; before opening a file and caches catalogue lists.
;
; Note GhostRoom is NOT a PvP archive: DataPC_GRN_GhostRoom.forge holds
; the in-game menus (gunsmith, lobby), so every mode reads it.
files=

; 1 also lists every *.forge name the scan runs into, so the mode
; specific ones can be found without guessing.  Noisy, off by default.
discover_forge=0

; Labels to watch in the game's OWN menus, comma separated, matched as
; case insensitive substrings.  The main menu names each mode on its own
; button, so the Ghost War item can be found by its text instead of a
; hardcoded screen position (which would break with the resolution, the
; UI scale and the next patch).  A matched item is polled twice a
; second and every change of its state vector is written as [UIW] - that
; is what shows a hover, a click or a confirm.
;
; [UITXT] lists every menu label it finds (capped), so if these do not
; match anything, read the log and put the real text here: the UI may be
; localised, and a non-ASCII label can be pasted as is.
ui_find=Ghost,Mercenar

; Where the Ghost War item sits on the main menu, measured once by
; hovering it and pressing the calibrate key (F9 by default) - the
; probe writes gw_x/gw_y back here. Coordinates are in the 1920 x 1080
; reference space, so they survive a windowed or resized game; a
; resolution or UI-scale change means calibrating again. -1 = not
; recorded yet. [CLICK] then reports every left click and whether it
; landed on the item.
gw_x=-1
gw_y=-1
gw_r=70

; The calibrate key, as a virtual key code.  0x78 = F9.
cal_hotkey=120

; The dump key, as a virtual key code.  0x77 = F8.
hotkey=119

; ---------------------------------------------------------------
; Menu translations.  They travel with the plugin; the framework
; reads this file first and falls back to scripthook.ini.  The menu
; title and its rows live in the plain [zh_cn] table, the hint in
; [zh_cn.Mode probe] because it is scoped to this menu.
; ---------------------------------------------------------------
[zh_cn]
"Mode probe" = "模式探针"
"Probe enabled" = "启用探针"
"Dump now" = "立即打点"
"Scan files now" = "立即扫描加载文件"

[zh_cn.Mode probe]
"Samples the GameFlow objects, the shell, the scene set, the PVP entity names and the loaded archives into logs\ModeProbe.log, one line per sample. Play one mode per session, then press the dump key (F8) to mark the moment. Nothing is changed." = "把 GameFlow 子对象、外壳、场景集合、PVP 实体名与已加载档案写入 logs\ModeProbe.log，每次采样一行。每个模式跑一次会话，按 F8 标记当下。不改变任何游戏行为。"
