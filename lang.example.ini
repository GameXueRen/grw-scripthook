; Example of <gamedir>\lang.ini - the text file a player may add.
; NOTE: rows whose key starts with @ are stable IDs (the framework and the
; plugins that ship with source). A row keyed by English text is a plugin
; without source - its literal is all it has. The full, current list is
; docs\text-cn-review.ini, regenerated from the build.
;
; NOTHING COPIES THIS FILE. A fresh install needs no lang.ini at all: the
; menu reads in English and Chinese out of the compiled-in tables (the
; framework's in scripthook_text.c, each plugin's own), and the language
; picker offers both with no file present. This file is for reading, and
; for copying by hand.
;
; A file at <gamedir>\lang.ini overrides the built-in text, and is the only
; way to add a language this build does not carry:
;
;   [ja-JP]                       section = a BCP-47 language code
;   "@settings.page" = 設定        a key starting with @ is a stable ID
;   "Ammo Capacity" = 弾薬容量     any other key is the English string a
;                                 plugin without source passes
;
; Only the rows written are used; every other row falls back to the
; built-in text. A plugin's own plugins\<name>\lang.ini wins over this file
; for that plugin's pages. The framework only ever READS this file - it
; never writes one - so a translation can be edited in place.
;
; The rows below are the built-in Chinese, listed for reference: copy the
; ones to change, or a whole section to start a new language.
[LanguageNames]
zh-CN = 简体中文
en-US = English

