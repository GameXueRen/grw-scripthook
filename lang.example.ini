; Example of <gamedir>\lang.ini - the text file a player may add.
;
; WHAT IS IN HERE: the framework's own menu text and nothing else - the root
; menu, the ScriptHook settings tree, the CPU scheduling page, the Forge Mod
; Loader page, the About page, and the status and toast lines. A plugin's text
; is not here: it lives in that plugin's own file, plugins\<name>\lang.ini.
;
; LAYOUT: one section per language. [en-US] is the English original, and the
; built-in Chinese translation follows it in [zh-CN]. Rows are key = value.
;
;   a key starting with @ is a stable ID - every row in this file is one
;   a key that is plain text would be the English string a plugin without
;       source passes to the game, which is why none of them are here
;
; VALUES: write the text as it should read on screen. %s and %d are filled in
; by the framework and must stay as they are. A literal \n starts a new line.
; Arrows are written as the characters themselves: ↑ ↓ ← →.
;
; Only the rows written are used; every other row falls back to the built-in
; text. The built-in text already carries both languages, so deleting this
; file - or any lang.ini - changes nothing. The framework only ever READS a
; lang.ini and never writes one, so a translation can be edited in place.
;
; NOTHING COPIES THIS FILE. A fresh install needs no lang.ini at all: the menu
; reads in English and Chinese out of the compiled-in tables, and the picker
; offers both with no file present. This file is for reading, and for copying
; by hand.
;
; TO ADD A LANGUAGE this build does not carry: copy one whole section, rename
; it to a BCP-47 code (e.g. [ja-JP]), translate the rows, put the code in
; [Settings] Languages= so the menu offers it, and give it a name under
; [LanguageNames]. If the script needs a font the game does not have, point
; [Settings] Font= at one. A plugin's own plugins\<name>\lang.ini wins over
; this file for that plugin's pages.

; A language's name as the picker shows it. The 16 rows below are the built-in
; ones - each language's name for itself - and a row here overrides the name
; compiled in for that code. A code with no row here still shows its built-in
; name, and one the build has never heard of shows the code itself.
[LanguageNames]
zh-CN = 简体中文
zh-TW = 繁體中文
en-US = English
fr-FR = Français
it-IT = Italiano
de-DE = Deutsch
es-ES = Español (España)
es-MX = Español (Latinoamérica)
pt-BR = Português (Brasil)
ru-RU = Русский
pl-PL = Polski
cs-CZ = Čeština
nl-NL = Nederlands
ar-SA = العربية
ko-KR = 한국어
ja-JP = 日本語

