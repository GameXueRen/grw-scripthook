; 弹药控制（AmmoControl）自己的设置。
;   上半是弹药上限倍率（走框架的 ShSetAmmoScale；1.00x = 不装钩，原版数值）；
;   下半是自动换弹：弹匣剩余 ≤ threshold、而且比这一匣见过的最多还少（也就是真开过
;   枪）时，按一次换弹键（ShFakeKey 注入按键）。换弹期间不会再按，换弹回来之后才
;   允许下一发 —— 所以只装一发的武器（榴弹）也能跟上，打一发按一发。
;
;   "弹匣还剩几发"只有装上容量钩子才读得到 —— 引擎问容量那次调用才会把当前武器
;   对象交出来。所以打开自动换弹时，插件会先装钩子、再把你选的上限写回去
;   （1.00x 时游戏数值不变）。关着自动换弹且上限 1.00x 时，插件什么都不做。

[Settings]
; 上限倍率的档位下标（0.20x 步进，共十档）：
;   0=0.20x  1=0.40x  2=0.60x  3=0.80x  4=1.00x
;   5=1.20x  6=1.40x  7=1.60x  8=1.80x  9=2.00x
multiplier=4

; 1 = 打开自动换弹；0 = 关
autoreload=0

; 弹匣剩余 ≤ 这个值时换弹（0..5）。只装一发的武器把这个值设成 1 照样能用：
;   判据是"这一发打掉了"而不是"弹匣低于阈值"，所以不会白等一轮。
threshold=1

; 换弹键的下标：0..25 = A..Z，26..35 = 0..9，默认 17 = R。
;   必须与游戏里"换弹"的按键绑定一致。
key=17
