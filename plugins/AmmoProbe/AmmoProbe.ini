; 弹药探针（AmmoProbe）自己的设置。
;   只读取证用，不随公测发包；证据写在 logs\AmmoProbe.log。
;   默认关：不开就不读、不钩、不写任何东西。
;
;   它的问题已经回答了（见 docs\ammocapacity-reverse.md §9）：
;     1) "当前弹匣还剩几发"是引擎交给容量函数的那些对象上 +0x180
;        （少数武器在 +0x130）的一个受保护 int——原始字节是打乱的，必须先解码；
;     2) "哪一把是我的"靠 +0x250 的 owner 句柄是否解析到玩家 root；
;     3) 框架侧 ShGetAmmoRounds 已按这三条落地：开火逐发跟随、换枪跟得上。
;
;   留着它是为了下一类问题（别的实体、别的武器偏移、别的边界情况）能直接取证。
;   打开后会打印：
;     shp:/ref: 每个新对象的类字、owner 解析、两套槽位数组（+0x130 与 +0x180 各 8 个）
;     ord:      引擎"被问对象"的每一次变化及其顺序（换枪时两把枪都会过这个函数）
;     以及受保护 int 与原始窗口里所有变化过的数值。

[Settings]
; 1 = 开始取证；0 = 什么都不做（默认 —— 装上插件不改变任何东西）
enabled=0

; base/len 是同一段窗口的两种用法：逐 8 字节找"指向合格对象的指针"，
;   以及逐 8 字节试"这里能不能解码成受保护 int"。默认 base=0、len=1024
;   覆盖对象头部 0x400 字节。两者都向下取到 8 的倍数，len 上限 2048（0x800）。
base=0
len=1024
