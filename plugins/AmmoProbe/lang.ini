# AmmoProbe text - 本插件随包附带的文案文件。
#
# [en-US] 是插件自带的英文原文；[zh-CN] 是当前内置的中文译文。
# 想改某一行：把那一行复制到本文件对应语言节里改值即可（本文件优先于内置文案）。
# 想加一门语言：复制一整节，把节名改成语言代码（如 [ja-JP]），再逐行翻译。
# 本文件与插件一起发布，框架只会读它、永远不会写它 —— 可以放心就地编辑。
#
# [en-US] is the text this plugin ships with; [zh-CN] is the built-in Chinese.
# A row here overrides the built-in text for that key in that language.
# To add a language, copy a whole section and rename it (e.g. [ja-JP]).
# The framework only ever reads this file; it never writes one.

[en-US]
"@ap.find" = "Find what is at hand (fast)"
"@ap.hint" = "Read only. Switch on, then switch weapons once or twice: the engine asks for a capacity then, and the object it hands over follows the equipped weapon. Then fire a burst of several rounds, reload and take a crate, pressing the matching marker each time - every number that moves is in logs\\AmmoProbe.log"
"@ap.m1" = "Mark: single shot"
"@ap.m2" = "Mark: reloaded"
"@ap.m3" = "Mark: ammo crate"
"@ap.on" = "Probe on"
"@ap.page" = "Ammo probe"
"@ap.st.none" = "off - nothing is read"
"@ap.status" = "obj+180 %u  raw %d  pi %d  shots %u"
"@ap.sweep" = "Sweep all memory for it (slow)"

[zh-CN]
"@ap.find" = "立即查找手头对象（快）"
"@ap.hint" = "只读取证。打开开关后换一两次枪 —— 引擎这时才会问容量，交出的对象跟着当前武器走。然后连打几发、换弹、补给，各点一次对应打点行；每一个会动的数都记在 logs\\AmmoProbe.log"
"@ap.m1" = "打点：开了一枪"
"@ap.m2" = "打点：换弹了"
"@ap.m3" = "打点：补给了"
"@ap.on" = "探针开关"
"@ap.page" = "弹药探针"
"@ap.st.none" = "未开启 —— 不读任何东西"
"@ap.status" = "对象+180 %u  原始 %d  解码 %d  枪声 %u"
"@ap.sweep" = "全内存扫描一次（慢）"

