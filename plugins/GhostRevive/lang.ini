# GhostRevive text: sections are BCP-47 language codes; rows are key = text
[zh-CN]
"Experimental. A Ghost Mode death that ends the run goes through a different path from one that does not; this tries to send every death down the reviving one. The method cycles: off, probe, noscene, reload, fixhp, cannotdie, prehp." = "实验功能。魅影模式下「会删档的死亡」与「不会删档的死亡」走的是两条不同分支，本插件试图让所有死亡都走重生那一条（回到最近检查点）。方法可循环切换：off 不干预、probe 仅记录、noscene 关闭死亡界面、reload 触发检查点重载、fixhp 死亡界面出现时把血量补满、cannotdie 免死、prehp 抢先回血。"
"Ghost revive" = "魅影模式死亡重生（实验）"
"Switch the method" = "切换方法"
"Watch and try to revive" = "启用观察与重生尝试"

