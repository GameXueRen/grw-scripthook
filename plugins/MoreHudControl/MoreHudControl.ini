; MoreHudControl —— 把游戏的 HUD 拆成一个个开关
;
; 游戏里每个 HUD 元素（小地图、准星、弹药显示……）都是一个独立的 phoenix 场景，
; 名字是游戏自己的。插件把它们做成菜单开关，改一下下一帧生效。
;
; 菜单文字跟随模组菜单语言：中文界面显示中文名，其它语言显示场景原名。
; 本文件只管“状态”，不要抄场景名进来。

[main]
; 当前预设槽（1..6）
slot=1
; 1 = 用内置的开关清单；0 = 只用这一局真正画出来的层
preset=1
; 1 = 写日志到 logs\MoreHudControl.log
log=1
; 1 = 额外的调试输出（标记/图标的逐条明细），正常游玩保持 0
debug_dump=0

; [presetN] 每个槽一份，键相同：
;   enemy          敌人（3D 标记）
;   enemy_blind    视野盲区的敌人：1 = 盲区照常显示（默认），0 = 只显示视野内
;   mm_scale       小地图缩放（%，50..200）
;   mm_alpha       小地图不透明度（%，20..100）
;   mm_bg          小地图背景     mm_icons    小地图图标总闸
;   mm_enemy       小地图敌人     mm_vehicle  小地图载具     mm_collect  小地图弹药箱
;   hit_indicator  受击指示       wanted      通缉等级       tutorial    其他教程
;   oth_drone      无人机         oth_bino    望远镜
[preset1]
mm_alpha=100
mm_scale=100
enemy=1
enemy_blind=1
mm_bg=1
mm_icons=1
mm_enemy=1
mm_vehicle=1
mm_collect=1
hit_indicator=1
wanted=1
tutorial=1
oth_drone=1
oth_bino=1

