; 名册行写在文件末尾的 [Names] 段里（见文件最后）。
; ── 名册（可选）──────────────────────────────────────────────────────────
; 你认出来的 NPC 写在这里：页面状态行会在 id 后面显示你的名字，导出的目录里
; 也会多出一列名字。id 用十六进制（带不带 0x 都行），名字爱写什么语言都行 ——
; 插件原样读取、原样显示，从不改写本文件。最多 512 条。
;
; 不必手打 id：在游戏里选中它，按页面上的'把选中项追加到名册'（或'把名单项
; 追加到名册'），插件会往本文件末尾追加一行 '<id>='，你只要把名字写在等号后。
; 追加是**只加不写**的 —— 但注意：追加只会落在**文件最后一节**里，所以
; [Names] 必须放在所有 [Settings] 键之后（段头会结束上一段）。
; 改名册不必重启，按一下'重新读取目录与名册'即可。本插件随包不带任何 id。
;
; [Names]
; 154BBB495E1=铁血战士
