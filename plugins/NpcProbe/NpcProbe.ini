; NPC 探针（NpcProbe）自己的设置。
;   只读取证用，不随包发布；结果写在 logs\NpcProbe.log。
;   默认关：不开就不建页面、不读目录、不写任何东西（装上插件本身不改变任何东西）。
;
;   它要回答的问题：这个构建上到底有哪些 NPC 可以召唤，以及"想要的那个"该怎么点出来。
;   数据来源是引擎自己的 archetype 目录（ShNpcCount / ShNpcAt，写这份时是 527 条），
;   分组用引擎随协议给出的 kind 换算（3=圣塔 5=联合军 6/7=反抗军 0/1=平民 4=特殊，
;   其余 kind 记作"未归类"）——库里不带任何第三方 id 表。
;
;   为什么还需要一个手填 id：[Settings] id 与 [Settings] ids（都在本文件里）。
;   第三方插件那张 Special 表的 76 个 id，在本构建的目录里一个都不存在；
;   ShSpawnNpc 仍然能召唤它们（走引擎的解析，不走目录），所以"目录里没有"
;   不等于"召唤不了"——手填 id 就能验证，这正是旧编号的复原通道。
;
;   页面（F4 → NPC probe；界面文字随 scripthook.ini 的 [Settings] Language 走，
;   随包内置 en-US 与 zh-CN，改词只需在 plugins\NpcProbe\lang.ini 里写那一行）：
;   根页 —— 影响"召唤本身"的设置，加上三个子菜单：
;     召唤距离          召唤落在**你镜头看的方向**上多少米（1.5 / 3 / 5 / 10 / 20 m）
;                       坐标取玩家位置（高度才对），方向取 ShCameraAngles 的 yaw
;     一次召唤几个      按一次召唤几个（1…10；并肩排开，不叠在你身上）
;     召唤时自动记入名册 开关：每次召唤都把那个 id 追进 [Names]（默认关；会加长文件）
;     玩家无敌          开关：生命组件的 god / no-damage 两个字节（ShSetGodModePlayer），
;                       开着时每秒补写一次，重生后不会掉
;     隐身（敌人看不见）开关：ShSetVisibility 的 0 与 1，开着时每秒补写一次
;     目录 →            挑，然后召唤
;         阵营          筛选：全部阵营 / 五个阵营 / 未归类（框架按 kind 做的粗分组）
;         kind          筛选：任意 kind / 0…15，**带条数**（如 "3 (238)"）
;                       两行可叠加：同时选中则只列"同时满足"的条目
;         只看有名册的条目 开关：只看 [Names] 里有名字的那些（你自己的短名单）
;         第几项        该筛选下的第几项（1 起，与日志同号；日志里 catalogue 那一列仍是目录内部下标 0 起）
;         记录选中项    把 id / kind / 分组 / 名字写进日志
;         召唤选中项
;         把选中项追加到名册
;     名单 →            你自己那串 id（[Settings] ids）
;         名单第几项（1…条数，与日志同号）/ 召唤名单项 / 把名单项追加到名册 /
;         召唤并跳到下一项（一次狩猎两个按键）/ 召唤手填 id
;     名册与文件 →
;         重新读取目录与名册（目录与 [Names] 都重读）
;         把名册写成文件（plugins\NpcProbe\NpcProbe.names.txt，一行一个名字）
;         把目录写成文件（plugins\NpcProbe\NpcProbe.catalogue.txt，整份 527 条）
;         把召唤出来的都收掉（ShDespawn，最多记 256 个）
;
;   两个开关是为"召唤敌对 NPC 来看一眼"准备的：铁血、联合军、圣塔都会当场动手，
;   一个不会死的玩家比一次读档便宜得多。两者都走框架自己的调用，插件不直接写引擎内存。
;
;   关于随包的那份目录（plugins\NpcProbe\npc-catalogue.txt，527 条）：
;   它是**某一个构建**上引擎给出的目录，作为"记录"随插件发布（构建哈希写在文件头里）。
;   插件**不拿它召唤、也不拿它显示** —— 召唤一律走引擎的注册表（表外的 id 召唤不出来，
;   日志会说 "no archetype block for the id"）；用别的构建的列表显示，正是上一张静态表
;   出错的方式。它唯一的用途是**核对**：每次读到引擎的目录后，插件会与它比一次并记日志：
;     npcprobe: the shipped catalogue agrees with this engine - 527 ids, …
;   两边不一致时会写明各有多少只在一边，并提示"游戏不是这份记录所读的构建"。
;   你机器上另有一份**活的**导出：plugins\NpcProbe\NpcProbe.catalogue.txt（"把目录写成文件"）。
;
;   为什么还要一行 kind：框架那五个阵营名是按 kind 粗分的（kind 3 一律叫"圣塔布兰卡"），
;   对本构建的 kind 3（238 条）里的特殊 NPC 并不成立 —— 实测铁血战士
;   （0x0154BBB495E1，目录第 252 条）的 kind 就是 3。
;   所以按阵营翻不到它，按 kind（或按 id）才翻得到。本构建实测的 kind 与条数（共 527）：
;     0:2  1:147  2:5  3:238  4:14  5:29  6:77  7:7  10:8
;
;   关于目录为 0：引擎的 archetype 目录只有世界加载完之后才读得到，而插件是在标题
;   画面时就加载的 —— 所以"刚进游戏时读到 0 条"是正常的。插件每秒重读，读到的那一刻
;   会**自己把页面刷新**（走框架的每帧回调 ShRegisterFrameCallback，在游戏线程上运行，
;   与菜单回调同一个线程）—— 不需要你点任何东西。
;   实测：世界加载完成那一秒就自动读到了（日志 `read again now the game is up`），
;   与框架装 frame hook 正好同一秒。
;   "重新读取目录与名册"那一行现在主要用于**在编辑器里补完 [Names] 名字之后**重读名册。
;   这一点很重要：ShSpawnNpc 要靠框架自己那份已收集的目录来解析 id，目录是 0 时
;   它会对**任何** id 都回答"no archetype block for the id"，看起来就是"召唤不出来"。
;
;   线程纪律：ShSpawnNpc 会阻塞到实体出现，所以菜单回调只登记请求，
;   真正的召唤由插件自己的工作线程执行（与 EnemyReinforce 的 WaveThread 同一约定）。

[Settings]
; 1 = 建立页面并读取目录；0 = 什么都不做（默认）
enabled=0

