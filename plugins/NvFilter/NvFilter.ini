# NvFilter - 强制替换游戏内夜视滤镜的外观。
# NvFilter - force-replace the look of the in-game night vision filter.
#
# 本文件是插件的配置文件，框架只会读它；但本插件会把你在菜单里选的两行写回这里。
# This is the plugin's configuration. The framework only ever reads it; the
# plugin itself writes the two rows you pick back into it.

[Settings]

# 0 = 整套关掉：不装任何钩子、不改任何着色器、不生成菜单页。
#    注意这与菜单里的「夜视滤镜替换 = 关」不是一回事：那个会装钩子、只是不替换。
# 0 = disable everything: no hooks, no shader substitution, no menu page. Note
#    this is not the same as the menu's "replace = Off", which does install the
#    hooks and simply substitutes nothing.
enabled=1

# ---- 第一行：夜视滤镜替换 / row one: replace ----------------------------
# 这一行是总开关，也是作用范围。只有它为 off 时插件才什么都不做 —— 也就是
# 让游戏用它自己那套外观（普通档绿色 + 颗粒，特殊装备各自的效果）。
#   off       关 —— 完全不替换，每一件装备自己决定外观 = 游戏原样
#   default   仅替换默认 —— 只改「没戴特殊装备」时的外观；
#             黄绿头盔仍黄绿、声纳护目镜仍黑白
#   all       全部替换 —— 直接丢弃引擎给的那个数值，所有配置统一成下面选的外观
# 别名 normal / only = default，everything = all。
#
# The master switch and the scope in one row. Only "off" leaves the game alone,
# which is what makes it the way back to the game's own look.
#   off       nothing is substituted; headgear decides for itself
#   default   only the mode the ordinary goggles use; the panoramic helmets keep
#             their yellow-green and the Sonar Goggles their black and white
#   all       every mode: the engine's value is discarded, so the look stops
#             depending on what is equipped
# Aliases: normal/only = default, everything = all.
replace=off

# ---- 第二行：夜视滤镜 / row two: the look -------------------------------
# 十七档，前两档是引擎自己那两种外观的算术写法，中间十二档是游戏拍照模式
# 自带的滤镜，最后三档是写出来的（琥珀 / 冷蓝 / 高对比绿）。取值 / values：
#
#   black-and-white  黑白        黄绿 = yellow-green        sepia     棕褐
#   apollo           胶片        lighthouse    青影         tennessee 紫调
#   arlington        冷调        bridge        洋红         montenegro 褪色
#   chief            土黄        songbird      柔和         madre     橄榄
#   burner           绯红        neutral       中性         amber     琥珀
#   cool-blue        冷蓝        contrast      高对比
#
#   The names are ours: the game's assets are codenamed (BURNER, LIGHTHOUSE,
#   TENNESSEE, ...) and a menu wants what a look looks like, not its codename.
#   The twelve Photo Mode ones are the game's own grades - the grey axis of its
#   32^3 look-up cubes, tabulated in plugins/NvFilter/nv_looks.hlsl. The three
#   at the end are arithmetic, written out in nv_filter_ps.hlsl.
#
# 别名 bw = black-and-white，yg = yellow-green。
# 这里只有替换效果：要「游戏原本那套」请把上一行设为 off，而不是在这一行找 ——
# 后者曾经有一个 "green" 取值，它既表示一个外观又表示「什么都不做」，选它会静默失效，
# 所以那个取值连同它需要的整段着色器分支一起删掉了。
#
# Aliases: bw, yg.
# All of them are substitutions. For the game's own look, turn the row above OFF -
# it is not a look here. There used to be a "green" value that doubled as "one of
# the looks" and as "do nothing", which made choosing it fail silently; it and the
# shader branch it needed are gone.
#
# 两行取值不认识时会分别退回 off 与 black-and-white，并在日志里写明合法取值。
# An unrecognised value falls back to off / black-and-white and says so.
look=black-and-white

# ---- 目标着色器的指纹 / the target shader's fingerprint ------------------
# 字节码长度 + 字节码 CRC32。游戏更新后如果重新编译了这个着色器，
# 改这两行即可，不必重编插件。NvProbe 插件会把它看到的指纹写进自己的日志，用于对照。
#
# Bytecode length and CRC32. A game patch that recompiles the shader changes
# these two values; update them here rather than rebuilding the plugin. The
# NvProbe plugin reports the fingerprints it sees.
#
# Measured in two separate sessions on the current build (GRW.exe 6A99768A):
target_len=4864
target_crc=B4230EAA
