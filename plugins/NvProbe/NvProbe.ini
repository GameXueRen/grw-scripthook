; NvProbe - which D3D11 pixel shader draws night vision?
;
; A read-only probe. It counts pixel-shader creations and per-frame bindings,
; writes a timeline to logs\NvProbe.log, and offers an A/B snapshot pair in
; the mod menu (F4). It never binds or rewrites a shader, never writes engine
; memory and never touches the swapchain.
;
; THE METHOD (manual, two clicks - timing does not matter):
;   1. open the mod menu (F4) with night vision OFF  -> row "1  Snapshot A"
;   2. press the night-vision key (the menu does not take that key from the
;      game)                                        -> row "2  Snapshot B"
;   3. row "3  Write A vs B to the log", then read logs\NvProbe.log
; The shader listed under "IN B, NOT IN A" is the night-vision pass.
;
; IDENTIFIED, 2026-10-02, and identical in two separate sessions:
;     night-vision pixel shader = bytecode 4864 bytes, CRC32 B4230EAA
; Its bytecode is dumped once, at start up, to logs\NvProbe_capture.bin, so it
; can be disassembled offline and matched by a replacement shader.

[Settings]
; 0 disables the probe entirely (no hooks, no menu page, no log).
enabled=1

; Which shader to dump. Recognised by length AND CRC32, so a false hit needs
; both to collide. A game patch changes the bytecode and therefore the CRC -
; re-point these two keys rather than rebuilding the plugin.
capture_len=4864
capture_crc=B4230EAA
