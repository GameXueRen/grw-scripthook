# NvProbe text - 本插件随包附带的文案文件。
#
# [en-US] 是插件自带的英文原文；[zh-CN] 是当前内置的中文译文。
# 想改某一行：把那一行复制到本文件对应语言节里改值即可（本文件优先于内置文案）。
# 想加一门语言：复制一整节，把节名改成语言代码（如 [ja-JP]），再逐行翻译。
# 本文件与插件一起发布，框架只会读它、永远不会写它 —— 可以放心就地编辑。
#
# [en-US] is the text this plugin ships with; [zh-CN] is the built-in Chinese.
# A row here overrides the built-in text for that key in that language.
# To add a language, copy a whole section and rename it (e.g. [ja-JP]).
# The framework only ever reads this file; it never writes one.

[en-US]
"@nvp.page" = "Night vision shader probe"
"@nvp.hint" = "A/B by hand, in three steps. 1) With night vision OFF, click 1. 2) Turn night vision ON (the key still reaches the game with this menu open) and click 2. 3) Click 3 and read logs\NvProbe.log: the shader that is in B and not in A is the night-vision pass. Nothing here changes a shader or the game."
"@nvp.snapA" = "1  Snapshot A  (night vision OFF)"
"@nvp.snapB" = "2  Snapshot B  (night vision ON)"
"@nvp.diff" = "3  Write A vs B to the log"
"@nvp.full" = "Write the whole shader table"
"@nvp.clear" = "Clear A and B"
"@nvp.idle" = "waiting"
"@nvp.aDone" = "A taken: %d shaders in use (night vision off)"
"@nvp.bDone" = "B taken: %d shaders in use (night vision on)"
"@nvp.diffDone" = "written - %d shader(s) in B and not in A"
"@nvp.dumped" = "table written to logs\NvProbe.log"
"@nvp.cleared" = "A and B cleared"
"@nvp.status" = "in use %d   A %d   B %d   new in B %d"

[zh-CN]
"@nvp.page" = "夜视着色器探针"
"@nvp.hint" = "手动两点对比，三步：① 夜视关闭时点「1」；② 按夜视键打开夜视（菜单开着时这个键照样传给游戏），点「2」；③ 点「3」，然后看 logs\NvProbe.log —— 在 B 里、不在 A 里的那个着色器就是画夜视的那个。本页不改任何着色器、不改游戏。"
"@nvp.snapA" = "1  拍快照 A（夜视关闭时）"
"@nvp.snapB" = "2  拍快照 B（夜视开启时）"
"@nvp.diff" = "3  把 A / B 对比写进日志"
"@nvp.full" = "写出整张着色器表"
"@nvp.clear" = "清除 A 和 B"
"@nvp.idle" = "等待中"
"@nvp.aDone" = "A 已拍：在用 %d 个（夜视关）"
"@nvp.bDone" = "B 已拍：在用 %d 个（夜视开）"
"@nvp.diffDone" = "已写入 —— B 有而 A 没有的着色器：%d 个"
"@nvp.dumped" = "整张表已写入 logs\NvProbe.log"
"@nvp.cleared" = "A 和 B 已清除"
"@nvp.status" = "在用 %d   A %d   B %d   B 新增 %d"
