; Optical camo enhancement - settings and translations.
; This file belongs beside the plugin as plugins\OpticalCamo\OpticalCamo.ini
; and is created from this copy on a fresh install; an ini that is already
; there is left alone, so a setting made in game survives an update.
;
; Enabled    0 = off (default), 1 = on.
;            The master switch.  While it is off nothing is applied, the
;            game is not read at all and the plugin's thread parks.
; Visibility the multiplier put on the player while the optical camo is
;            live: smaller = harder to detect.  Nine steps, 0.10 .. 0.90,
;            default 0.50; whatever is here is snapped to the nearest one
;            on load.

[OpticalCamo]
Enabled=0
Visibility=0.50

