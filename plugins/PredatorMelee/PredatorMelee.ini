; 铁血战士大混战（PredatorMelee）自己的设置。
;   本文件**只读**：插件从不写它。页面上的调节只在本次会话有效；
;   想改默认值，就改这里的 [Settings]，下次进游戏生效。
;   默认关：enabled=0，此时不建页面、不读目录、不召唤任何东西。
;
;   id 是召唤对象（默认铁血战士），换一个 id 就能用同一套菜单召唤别的 NPC：
;   0x0154BBB495E1 = 铁血战士，实测来自本构建目录第 252 条，kind 3
;   （名单第 29 项 —— 页面"名单第几项"与日志同号）。
;
;   页面（F4 → 铁血战士大混战；顶部有一行提示：它们会打你，两次召唤必须间隔
;   60 秒）：
;     召唤铁血战士（CD 60s）        按一次出一批；60 秒内再按**会在屏幕上弹一条
;                                   提示**（框架的 toast，2.5 秒）：
;                                   "召唤冷却中，还剩 N 秒可召唤"，同时日志记一行。
;                                   顶部那行提示是**静态**的（只说规则），
;                                   倒计时只在底部状态行与这条 toast 里。
;                                   另外两种拒绝也弹：场上已满（带 已有/上限 两个数）、
;                                   上一批还在出。
;                                   这一批**真的出来之后**还会弹一条绿色的：
;                                   "召唤成功（本次 N 个，累计 M 个）"
;                                   （M 就是底部状态行"已召唤"那一格）。
;                                   本次一个都没出来时，弹的是琥珀色的
;                                   "这一次没有出来（看日志），累计 M 个"。
;     召唤数量上限                  6…30，默认 20，步进 1
;                                   —— 这是**场上总数**的天花板，而且是**动态**的：
;                                      只数"此刻还活着"的，每秒重算一次。打死一个
;                                      （或它被引擎回收）就腾出一个位置，**不必退出
;                                      战局**就能再召（仍受 60 秒 CD 约束）。到顶时
;                                      召唤会被拒绝；只差几个位置时本次数量自动缩减。
;                                      边界一：计数最多滞后一秒。边界二：本页最多记
;                                      256 个实体（一局累计）；超出之后的不被计入
;                                      数量与上限，日志会说明。
;     每次召唤数量                  1…6，默认 1，步进 1
;     出场距离                      5…50 米，步进 5，默认 5
;     出场血量                      10%…100%（＝0.1…1.0 倍血量上限），默认 50%
;     已召唤的血量清零（一枪即倒）  把已经召唤出来的血量写成 0 —— 当场倒下
;                                   （是"倒地"，不是凭空消失）；一秒后日志复核
;                                   还剩几个站着
;
;   三件**不再有选项**的事，按固定值走：
;     · 阵型：固定"随机散布"（自动贴地）—— 大混战要的就是散开；
;     · 朝向：固定"旋转展开"，步长自动取 360 ÷ 本次数量，一批正好铺满一圈，
;             这是防止同一批重叠的手段；
;     · 每批绕圈：固定 40°，即每按一次，下一批比上一批多绕 40°（9 批绕一圈），
;             这是防止不同批堆在一起的手段。
;
;   两条说清楚，不装样子：
;   1. 血量**只能 ≤1.0 倍**：血上限是只读的（scripthook_health.c 只读 OFF_MAXHP，
;      没有写入路径），所以"×10 耐打"做不到。出场血量写的是**刚出现那一刻**
;      （只写一次）。（血量不做循环补写：EnemyReinforce 当年反复"硬化"自己召唤
;      的东西，把游戏冻住过 —— 见该插件文件头。）
;   2. **谁打谁由引擎决定**：阵营是引擎私有的，框架也拿不到。插件只能把它们
;      摆到一起；会不会互相打、打谁，是 AI 的事。
;
;   状态行（底部一行）：召唤CD 0s | 5 米 | 血量 50% | 已召唤 0 | 存活 0
;     "已召唤"＝本页一局里累计召出来的个数（账本最多 256 条）；
;     "存活"＝其中**此刻血量 > 0** 的个数，每 0.25 秒重探一次 —— 打死一个，
;     半秒内那一格就会减一，同时在上限里腾出一个位置。
;
;   出场距离与出场血量都是**十档列表**，标签自带单位（5 米…50 米 / 10%…100%），
;   所以页面上不会出现一个没头没尾的数字。默认 5 米、50%。
;
;   2026-09-27 改版：删了阵型 / 朝向 / 朝向步长 / 绕圈展开 / 它们不死 /
;   取消本次召唤 / 把召唤出来的都收掉 这七行；新增 60 秒召唤 CD、场上总数上限、
;   米制距离与默认 50% 血量。"收掉"是删掉而不是修 —— 框架的 retire 地址在本构建上
;   是坏的（见 scripthook_npc.c 的 RETIRE 注释），与其留一个按下去没反应的行，不如
;   用"血量清零"。若某一批卡住不动超过 15 秒，插件会自己把它停掉并在日志里说明。

[Settings]
; 1 = 建页面；0 = 什么都不做（默认）
enabled=0

; 召唤对象：archetype id（十六进制，带不带 0x 都行）+ 页面上显示的名字。
id=0x0154BBB495E1
name=铁血战士

; 每次召唤数量：1…6（默认 1）
count=1
; 场上总数上限：6…30（默认 20）
cap=20
; 出场距离（米）：5…50，步进 5（默认 5）
distance=5
; 出场血量：0.1…1.0（默认 0.5，即 50%）
hp=0.5
