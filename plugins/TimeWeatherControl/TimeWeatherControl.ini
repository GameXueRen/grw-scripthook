; 天气 & 时间实时控制（TimeWeatherControl 插件）自己的设置。
;   改动也可以在 F4 菜单的「天气 & 时间实时控制」页里做，会写回本文件。
;   所有改动都走框架自己的引擎调用：这里不补丁代码、不自己写内存。
;
;   时间与流速分工不同：小时/分钟只在菜单里回车「应用当前设置的时间」时下发，
;   之后钟自己走；四段流速则按当前时刻落在哪个窗口每秒下发。

[Settings]
; 1 = 启用；0 = 只记住选择、什么都不做（默认 —— 装上插件不改变世界）
on=0

; 小时（24 小时制 0-23）、分钟（0-59）：
;   这两项要回菜单里按回车「应用当前设置的时间」才生效
hour=12
minute=0

; 四段流速：0.00=停住  1.00=原版  50.00=最快
;   步进：0.00-10.00 用 0.50，10.00 以上用 1.00（菜单行里左右选择）
;   窗口：黎明 05:00-07:00 / 白天 07:00-18:00 /
;         黄昏 18:00-20:00 / 夜晚 20:00-05:00（跨零点）
;   落在窗口交界处时按"当前时刻在哪个窗口"硬切换。
dawn_speed=1.00
day_speed=1.00
dusk_speed=1.00
night_speed=1.00

; 天气：0=默认动态（交还引擎）  1=晴天  2=阴云  3=多云
;       4=起雾  5=下雨  6=风暴
weather=0
