; Time and weather control (the rewrite of Time&Weather.asi).
; See docs/timeweather-reverse.md (not shipped in the repository).
;
; These keys are this plugin's own. The old plugin kept its two speeds in
; [DynamicTimeWeather] DaySpeed / NightSpeed and its weather in the same
; section; those are NOT read here, so a migration is a hand edit of three
; lines. Speeds are multipliers: 1.00 is the game's own rate, 0 stops the
; clock, 100 runs a day in about fifteen minutes.
;
; Four windows, each on its own rate, with nothing between them: a setting
; takes effect at the boundary. The edges are the old plugin's own; what is
; gone is the interpolation it put across them, which is why a change now
; arrives at once rather than drifting in.
[TimeWeather]
enabled=1
; default | sunny | light_clouds | heavy_clouds | fog | light_rain | heavy_rain
weather=default
; 0.00~10.00，步进 0.25；1.00 是游戏原版速率，0 停止时间。
day_speed=1.00
dusk_speed=1.00
night_speed=1.00
dawn_speed=1.00
; Where the "Apply Time" row starts from, 0-23 and 0-59.
hour=12
minute=0
