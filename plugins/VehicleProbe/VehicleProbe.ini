; 载具 id 探针（VehicleProbe）自己的设置。
;   只读取证用，不随包发布；结果写在 logs\VehicleProbe.log 与 logs\VehicleProbe-found.txt。
;   默认关：不开就不读、不扫、不写任何东西（装上插件本身不改变任何东西）。
;
;   它要回答的问题：游戏里还有哪些可召唤载具没有收进框架目录
;   （scripthook_spawn.c 的 g_vehicles，目前 65 条）。
;
;   依据：载具是用"掩码句柄"命名的 —— 低 32 位是种类哈希 0x8F2CBBBA、
;   高 32 位是载具 id（见 scripthook_spawn.c 的 VEH_KIND_HASH）。所以内存里
;   任何低 32 位等于这个常量的 8 字节，高 32 位就是载具 id —— 不需要目录就能读出来。
;
;   打开后：
;     F5        立刻扫描身边 radius 米内的载具（含"你正开着的"那辆）；
;               不在目录里的 id 当场写进本文件的 [Found] 段并记日志。
;     Ctrl+F5   全场扫描（约 15~30 秒，逐段进度写日志）：收集内存里出现过的
;               所有载具 id，并用"同一 id 的多处出现是否指向同一个 spec 表头"
;               剔除误报 —— 判出来的那个值可以和 logs\scripthook.log 里
;               "spawn: spec vtable learned:" 那行对照。
;
;   结果怎么用：logs\VehicleProbe-found.txt 每行一个 id（按出现次数排序），
;   其中最像真车、又还没有名字的那些，已经按目录格式排好了（名字留空）——
;   在游戏里生成一辆看一眼，把名字补进引号里发回即可。

[Settings]
; 1 = 开始取证；0 = 什么都不做（默认）
enabled=0

; 身边扫描的半径（米）。0 = 只查你正开着的载具，不枚举附近
radius=150

; 热键（虚键码）：116 = F5。全场扫描是同一个键 + Ctrl
hotkey=116

; 进入游戏后自动跑一次全场扫描（0 = 只按键触发，默认）
scan_on_load=0

; 候选门槛：一个不在目录里的 id 至少被看到几次，才会被列进"可命名候选"。
;   默认 3 —— 这类巧合（两个 dword 撞上种类哈希）经常出现两次，真车通常多得多
min_hits=3

; 以下是探针自己写的：每找到一个 id 记一行，删掉不影响功能
[Found]
