; Ammo capacity, the framework's replacement for AmmoCapacity.asi.
; The key keeps the old plugin's name and decimal form, so an ini carried
; over from it reads the same. The value is matched to the nearest of the
; six the old plugin offered: 0.50, 0.75, 1.00, 1.25, 1.50, 2.00.
; 1.00 is vanilla and installs no hook at all.
; A change takes effect at the next refill - visit an ammo crate.
[AmmoCapacity]
Multiplier=1.00
