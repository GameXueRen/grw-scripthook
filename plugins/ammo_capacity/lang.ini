# ammo_capacity text: sections are BCP-47 language codes; rows are key = text
#
# Every plugin that ships a lang.ini carries this file, and this one was the
# odd one out - the plugin's text is compiled in (kZh below), so a missing
# file was a difference in packaging rather than a missing translation. It is
# here for the same reason the others are: the place to reword a line without
# touching the plugin. Keys are stable IDs, so the wording can change freely.
#
# The rows below are the compiled-in text, commented out: uncomment one and
# it overrides what the plugin ships.
