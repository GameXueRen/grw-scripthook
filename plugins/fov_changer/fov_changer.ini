; fov_changer - 延展视野范围插件配置
;
; 游戏内在 F4 菜单里改动后，会写回本文件（改动后约半秒内落盘）。
; 删掉本文件 = 下次启动回到默认（两个开关都关闭）。
; 插件启动时只读一次，之后由菜单接管。
;
; fov_changer - settings for the Field of view plugin.
; The menu writes this file back within about half a second of a change.
; Delete it to start fresh (both switches off). Read once, at startup.

[Settings]
; 覆盖游戏视野范围设置：1 = 覆盖，0 = 不覆盖
; Override the game's own fov: 1 = on, 0 = off
override=0
; 覆盖的垂直视野范围，单位：度（30 ~ 140）
; Vertical fov to hold, in degrees (30 - 140)
fov=47
; 机瞄开镜不缩放：1 = 开，0 = 关
; No zoom on iron sights: 1 = on, 0 = off
nozoom=0
