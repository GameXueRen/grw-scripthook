# fov_changer text - 本插件随包附带的文案文件。
#
# [en-US] 是插件自带的英文原文；[zh-CN] 是当前内置的中文译文。
# 想改某一行：把那一行复制到本文件对应语言节里改值即可（本文件优先于内置文案）。
# 想加一门语言：复制一整节，把节名改成语言代码（如 [ja-JP]），再逐行翻译。
# 本文件与插件一起发布，框架只会读它、永远不会写它 —— 可以放心就地编辑。
#
# [en-US] is the text this plugin ships with; [zh-CN] is the built-in Chinese.
# A row here overrides the built-in text for that key in that language.
# To add a language, copy a whole section and rename it (e.g. [ja-JP]).
# The framework only ever reads this file; it never writes one.

[en-US]
"@fov.fp" = "First person fov"
"@fov.hint" = "Widens the first and third person fov"
"@fov.notready" = "the camera is not ready"
"@fov.nozoom" = "No zoom on iron sights"
"@fov.override" = "Override"
"@fov.page" = "Field of view"
"@fov.reset" = "Back to the game default"
"@fov.status.both.off" = "fov %.0f deg (game %.0f)\nno iron sights, engine %.2f, camera %.2f"
"@fov.status.both.on" = "fov %.0f deg (game %.0f)\niron sights: engine %.2f, camera %.2f"
"@fov.status.off" = "off, game is %.0f deg"
"@fov.status.on" = "%.0f deg, game default %.0f"
"@fov.tp" = "Third person fov"

