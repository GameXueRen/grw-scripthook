# micfix text - 本插件随包附带的文案文件。
#
# [en-US] 是插件自带的英文原文；[zh-CN] 是当前内置的中文译文。
# 想改某一行：把那一行复制到本文件对应语言节里改值即可（本文件优先于内置文案）。
# 想加一门语言：复制一整节，把节名改成语言代码（如 [ja-JP]），再逐行翻译。
# 本文件与插件一起发布，框架只会读它、永远不会写它 —— 可以放心就地编辑。
#
# [en-US] is the text this plugin ships with; [zh-CN] is the built-in Chinese.
# A row here overrides the built-in text for that key in that language.
# The Chinese is the width reference: the English is kept no longer than it,
# counting a CJK character as two columns.
# The device row itself shows the alias the fix hands the game
# ("Mic1(Realtek High Definition Audio)", ...), which is not translated on
# purpose: it is what the game is told, not a caption.

[en-US]
"@mic.page" = "Game mic fix"
"@mic.fix" = "Give ASCII mic names (restart game)"
"@mic.force" = "Force picked microphone (restart game)"
"@mic.device" = "Microphone"
"@mic.rescan" = "Rescan microphones"
"@mic.status" = "Mic: %d   Force: %s   %s"
"@mic.force.on" = "On"
"@mic.force.off" = "Off"
"@mic.note.off" = "Fix off: names are untouched"
"@mic.note.fix" = "Non-ASCII names get replaced"
"@mic.note.force" = "Picked microphone only"
"@mic.none" = "No microphone"
"@mic.hint" = "Fixes the mic not working in some setups"

