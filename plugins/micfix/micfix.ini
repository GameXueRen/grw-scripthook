; Microphone fix - settings.
; This file belongs beside the plugin as plugins\micfix\micfix.ini and is
; created from this copy on a fresh install; an ini that is already there is
; left alone, so settings made in game survive an update.
;
; The game reads its recording devices' names and cannot cope with a name
; that is not ASCII, which is why a Chinese Windows shows it no microphone
; at all.  The fix below hands it an ASCII alias instead, for this process
; only - no system setting and no device name is touched.
;
; The game asks two doors about a device - the DirectShow property bag and
; the Core Audio property store - and it needs both to answer the same name,
; so a device is renamed on both or on neither, never on one of them.
;
; fix         0 = leave every device name alone.
;             1 = hand the game "Mic1(Realtek High Definition Audio)" and so
;                 on, for every recording device that has a non-ASCII name
;                 in either door (default: on - loading the plugin is the
;                 opt-in).  A device whose names are all ASCII is never
;                 touched.
;
; force       0 = the game is offered every recording device (default).
;             1 = it is offered the picked device and no other.  Picking a
;                 device in the F4 menu turns this on by itself.
;
; probe       0 = the log keeps the milestones (default).
;             1 = every device, property read and rename also goes to
;                 logs\micfix.log.  Only useful while something has to be
;                 explained: it writes a great deal.
;
; device      the picked device's position in the scan, as the menu shows it.
; device_key  the same device's moniker display name - ASCII, unique and
;             stable across sessions.  This is what `force` matches on, so
;             the pick survives a driver reinstalling its devices in a
;             different order.  Both are written by the menu; there is no
;             need to edit them by hand.

[Settings]
fix=1
force=0
probe=0
device=0
device_key=
