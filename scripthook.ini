; [MenuOrder]：根菜单里各页的显示顺序。
; 键 = 页面键：@开头的稳定 ID，或插件标题的字面量（如 "Vehicles"）
; 值 = 排序权重，数字越小越靠前。未列出的页权重默认 1000，
;      未设权重的按注册顺序排在已配置的后面。
;
; 所有页都能排，框架自己的两页也一样，它们只是默认靠前：
;     "@settings.page"     = 0    （ScriptHook 设置）
;     "@forge.page"        = 10   （Forge资源侧载（实验功能））
; 这两行只在键缺失时自动补写一次，之后改过就不会被写回。
;
; 也可以游戏内改：F4 →「ScriptHook 设置 → 菜单排序」，每行一项，
; 按 ← → 把它上移/下移一位。那样改完本段会按 0/10/20… 整段重写；
; 当前不在根菜单里的页（插件被关、或被当前模式禁用）不参与，
; 也保持原值——所以可能出现与保留值相同的权重，同权重按稳定排序，
; 先出现的在前，直到其中一项被移动为止。
; ------------------------------------------------------------
[MenuOrder]
@settings.page = 0
Forge Mod Loader = 10
Vehicles = 20
First person = 30
Field of view = 40
Time & Weather = 50
Skip intro videos = 60

