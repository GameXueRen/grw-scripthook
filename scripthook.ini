;  GRW ScriptHook 主配置文件，放在游戏根目录（与 GRW.exe、dinput8.dll 同级）
; 保存后下次启动生效。

[loader]
; 0 = 启动时不加载任何插件
load_plugins=1

; 覆盖层（F4 菜单那一层）总开关：1 = 开（默认），0 = 完全关闭。
;   关掉后：不扫描窗口、不捕获/挂钩 Present、不子类化游戏窗口 —— 游戏完全
;   不被这一层碰。它就是用来做对照的：出问题时先把它关掉跑一次，就能立刻
;   分清"是覆盖层"还是"框架的其它部分"。改动下次启动生效。
overlay=1

; ---- CPU 调度：按游戏启动阶段分别设置 ----
; 每个阶段一个档位，取值：
;   0 = 不干涉：什么都不设置，交由系统调度（系统自己的自动优化也保留）
;   1 = 全部核心(强制)：强制使用本机全部处理器，用来覆盖系统的自动优化
;   2 = 禁超线程：每个物理核心只保留一个逻辑核心
;   3 = 禁小核：只保留大核 P-core（仅 Intel 12代+ 大小核；其它 CPU 不适用、不做改动）
;   4 = 禁超线程+小核
; 游玩阶段额外提供：5 = 仅禁CPU0，6 = 禁超线程+CPU0，7 = 禁小核+CPU0，8 = 三者全禁
;
; 三个阶段是"依次走过、不回头"的三步（同一次游戏里各进入一次）：
;   Logo 阶段：从启动画面出现到游戏主窗口出现（两个窗口靠"类名 + 标题"一起认：
;     启动画面类 ScimitarSplashScreenWindow、标题里注册商标是乱码；主窗口类
;     ScimitarEngineWindowClass、标题正常。先看类名，类名不认识则退回只看标题）。
;     此阶段禁超线程可让 logo 界面秒进。
cpu_boot=0
;   窗口加载阶段：从主窗口出现到进主菜单（第一次加载，引擎自己还在忙）。
;     部分机器禁小核可秒进，另有机器（被 Win11 自动优化过）需要"全部核心(强制)"
cpu_window=0
;   游戏中：首次进主菜单之后的一切都算 —— 主菜单、大厅、之后的加载界面、
;     暂停菜单、世界，直到退出游戏。禁超线程 / 禁 CPU0 用于缓解间歇性卡顿。
cpu_play=0

; ---- 各阶段的进程 CPU 优先级 / 效率模式 ----
; 阶段划分同上（Logo → 窗口加载 → 游戏中，依次走过、不回头）
;
; 游玩阶段优先级（0=不干涉 1=正常 2=高于正常 3=高，默认 0=不干涉）
;   不干涉 = 保持游戏自己的设置；到该阶段时还原成我们介入前的状态
;   游戏启动时会自己设置优先级，设为非"不干涉"后由我们持续保持，不会被改回去
;   不提供"实时"：实时优先级可能让系统输入 / 音频卡顿
cpu_prio_play=0
;
; 加载阶段使用效率模式（0=不干预，默认；1=开；2=关）—— 这一项管 Logo 与窗口加载两个阶段
;   开：这两个阶段保持 Win11 的「效率模式」(EcoQoS，任务管理器里那一列)，
;       让调度器优先用能效核、允许降频 —— 这两段正是"不贡献前台体验"的工作。
;   关：什么都不设置，优先级类保持原样。
;   本机不支持时（效率模式是 Win11 才有的：更早的系统上同样的请求只会把进程
;     标成 LowQoS，并不是这个模式）：改为保持「低」优先级类代替 —— 同样是
;     "加载时把机器让出去"的意思，用本机真有的手段实现；日志会写一行说明，
;     菜单「CPU 调度控制」页的提示行也会写明。
;   不管落在哪一种，进入游戏中阶段都会还原成我们介入前的状态；
;   进程启动前就已被外部开启的效率模式，我们一律不动。
cpu_eco_boot=0

; 游玩阶段最大逻辑核心数（0～64，0 = 不限制）。
;   仅游玩阶段生效；启动阶段（Logo / 窗口加载）不做限制，避免影响游戏启动。
cpu_cores=0

; 1 = 开启泄漏探测心跳：渲染线程每 5 秒在日志输出一行 leak: 记录
;     （进程私有内存/工作集/页面文件 + UI widget/纹理 + 场景槽位计数），
;     用于长时间挂机排查内存是否单调增长。默认 0（关闭）。
; 关闭时每帧仅一次布尔判断，对性能无影响。
leak_probe=0

[plugins]
; 每个插件一行，按 plugins/ 下的文件夹名：1 = 加载；0 = 不加载。
;   **没有这一行 = 加载**：新加进来的插件（你自己放进去的，或更新带进来的）
;   默认就启用，不用先跑一趟菜单。首次扫描会把缺行的插件补一行 =1，
;   所以这张表最终会列全每个插件目录。
; 想关掉某个插件：菜单「ScriptHook 设置 → 各插件开关」里关（会写 0 到这一行），
;   或者直接删掉 plugins/<插件名>/ 文件夹。
; 文件夹名与 .asi 文件名必须一致：plugins/<name>/<name>.asi。
; 删掉本文件 = 恢复默认，而现在的默认是"plugins/ 下的插件全部加载"；
;   注意 [loader] 的 CPU 调度档位与语言也会一并回到默认；文案不会丢，
;   译文在 lang.ini 里（程序只读、永不回写）。
firstperson=1
fov_changer=1
spawner=1
skipintro=1
freecam=1

;   它把 GameFlow 子对象与其类哈希、外壳 HybridMenu、当帧场景集合、输入上下文
;   与 PVP 专属实体名采样进 logs\ModeProbe.log，并按进程分段（切模式会重启客户端）。
;   不装任何 hook、不写任何游戏内存。取证完成后可关闭或删除本插件。

; 解锁游戏全部语言（AllLanguages 插件，原名 LastRites_dlcfix）。
;   已实测确认：RU/CN 版本把文本语言限制为中文与俄语，该限制来自游戏对授权
;   查询条目 3718 的答案；插件仅对这一条答「已获得」，条目号写死在代码里、
;   不可配置，其余条目（含全部付费 DLC）一律返回游戏原本的答案。
;   该条目最初是在修「最后的仪式」DLC 闪退时找到的（官方已于 2026-09 修复）。
;   开关在模组菜单「解锁游戏全部语言」里，默认关，关闭时不安装任何钩子；
;   改动于下次启动游戏时生效。仅单机使用。
AllLanguages=1

; 魅影模式不删档（GhostNoWipe 插件）：魅影模式完全死亡后，游戏会把存档标记为
;   已删除，共两处记录：一是把 N.save 改名成 N.save.delete 并写入一份 .delete
;   （这个 .delete 本身就是存档界面读取的"已删除"记录之一，不是临时残留）；
;   二是在改名之前，游戏已经把"本局结束"写进了 N.save 自己的内容里（实测比死亡
;   画面晚约 10 秒、比改名早约 19 秒）。两处任一留痕即被判为已删。
;   插件三处都守住：① 存档写入（.tmp 就位）时用干净副本把它换回去，内容始终停在
;   你活着时的最后一次存档；② 拦下改名且不留下任何替代文件；③ 把对 .delete 的
;   写入改道到插件自己的 temp\ 目录。结果是磁盘上不残留任何删档痕迹、存档内容也
;   不被改写，进度退回最近存档点。
;   回到存档界面时游戏内存里仍认为该档已删（这一步发生在进程内，无法也不需要拦），
;   因此插件会在同一时刻于屏幕上方常驻一条状态提示，说明"存档已保住、重启后继续"，
;   直到你重新进入游戏才自动收起。重启游戏重新扫描目录后，该档即恢复显示并可继续
;   游玩。游戏每次重建存档列表都会重做改名，所以一律拦截。
;   注意：你在界面里手动删除魅影档走的是同一套流程，也会被拦下；确实要删档时，
;   先在菜单或插件 ini 里关掉本插件，删完再开。
;   云同步关闭时使用；若开启云同步，保留的本地档可能与云端状态冲突。
;   仅单机使用；官方修复后请关闭开关并删除 plugins/GhostNoWipe。
GhostNoWipe=1

; 魅影模式死亡改为重生（GhostRevive 插件，实验，已停用）。至此已确认此路不通：
;   魅影模式的死亡分支由「AI 队友是否在场」决定——有队友时走 7→5→4（重载检查
;   点 + 血量重置，即重生），无队友时走 7→4→7 反复、血量恒为 0，最后 5→1 回
;   菜单删档；而 GAMEOVER 之前两者完全一样，没有可提前观察的差异。
;   插件试过的外部干预全部无效：ShTriggerGameOver(1) 被接受但被忽略；死亡后把
;   血量补满（游戏内补到 3750 成功）也改变不了结局——56 毫秒后游戏照样判死，
;   因为血量不是它的判据；GAMEOVER 态下补血直接被拒。详见 GhostRevive.c 头注释
;   与 .codebuddy/plans/ghost-revive-findings.md。
;   本行保持 1（让插件加载、菜单可见），但插件自己的 GhostRevive.ini 里
;   enabled=0，因此它不注册任何动作、不写监视日志，游戏行为与未装时一致。
;   想重新实验时，在插件 ini 或模组菜单里把开关打开即可。与 GhostNoWipe 互不
;   干扰，两者可同时启用。仅单机使用。
GhostRevive=1

test_plugin=0
chaos=0
CrazyCars=0
hitfling=0
Reinforcement=0
tp_roulette=0
tpgun=0
ui_sample=0

; 插件自绘 UI 的示例（draw_sample 插件）：一个窗口 drawer（文字/按钮/开关/数字/
;   滑块/下拉 + 输入框）加一个无边框角落常驻读数，演示公共绘制 API。
;   两个开关都能在模组菜单「Drawing sample」页里实时切换并写入插件自己的 ini；
;   详见 docs/ui-drawing.md。默认开（只是画两个窗口，不碰游戏内存）。
draw_sample=1

; 游戏内中文聊天输入（cnchat 插件）：按 T 打开自绘输入框、支持输入法中文与候选窗、
;   Enter 把文字注入游戏自己的聊天框、Esc 取消。功能总开关在插件自己的 ini 里
;   （plugins\cnchat\cnchat.ini 的 enabled，默认 0）；本行只决定插件是否加载。
;   详见 docs/ui-drawing.md 第五节。
cnchat=1

; 天气 & 时间实时控制（TimeWeatherControl 插件）：F4 菜单「天气 & 时间实时控制」
;   一页做完 —— 天气七档（第一项"默认动态"= 交还引擎）、当天时间（小时/分钟，
;   回车「应用当前设置的时间」才跳钟）、四段流速（黎明 05-07 / 白天 07-18 /
;   黄昏 18-20 / 夜晚 20-05，每段 0.00-50.00，≤10 步进 0.50、10 以上步进 1.00）。
;   所有改动都走框架自己的引擎调用：不装钩子、不写游戏内存。插件自己的 ini 里
;   总开关默认关（on=0，装上不改变世界）；关掉开关或进入 Ghost War / 佣兵模式
;   （黑名单）时，把天气与流速交还引擎。
;   它是本仓库自己写的时间/天气页：菜单形态与时段划分沿用社区同类设计，代码为
;   本项目实现，未使用任何第三方插件的二进制或其反汇编。
TimeWeatherControl=1

; 说明：光学迷彩加强、弹药上限、NPC 生成这三项功能，原实现是对社区作者
;   IHateHUDClutter 作品的重写/复刻，已按作者本人要求于 2026-09-20 从本仓库与
;   发售包中移除。需要这些功能，请到作者处获取他的最新版本（TU25 已由他本人
;   更新）。上面的 TimeWeatherControl 不在移除范围内。

[Settings]
; 菜单语言。**这一行留空/删掉**（新装就是这样）时，启动会自己选一次：
;   取 Windows 用户语言 → 在下面的 Languages（或本版本内置语言）里匹配
;   （精确命中优先；同一门语言的不同变体也算命中，如 zh-TW / zh-Hans → zh-CN、
;    en-GB → en-US）→ 都不中则用英文 en-US；
;   随后把选中的码**写回本文件**，并往 logs\scripthook.log 写一行 language: ... 说明依据。
; 从第二次启动起，本行就是唯一依据：改它、或在菜单「菜单语言」里改，都立即生效并写回。
; 删除本行 = 下次启动重新按当时的系统语言选一次。
;Language=zh-CN

; 菜单字体。留空 = 用内置候选表，顺序：
;   [Settings] Font= → <游戏目录>\font.ttc|\font.ttf|\msyh.ttc →
;   Windows 系统字体（msyh / simhei / simsun）→ Z:\usr\share\fonts\...（Wine/Proton）
; 一个中文字体都找不到时：菜单退回 ImGui 内置字体，并把**本次会话**切成英文
; （不写回本文件）。想要中文：装 fonts-noto-cjk、把字体丢进游戏目录、或在这里指路。
; 填 none（或 -）= 假装本机一个字体都没有：菜单会走上面那条兜底（英文 + 内置字体），
;   用来在 Windows 上复现 Linux/Proton 的现象。
Font=
; 聊天框用的加粗字体。留空 = 按同一顺序找（msyhbd / Noto CJK Bold），找不到就用上面的字体
FontBold=

; 模式取证探针（ModeProbe / ModeCallProbe 插件）：只读取证工具。模式识别能力
;   完成后默认关闭；需要重新取证时改回 1（并先删除旧日志）。
;   ModeProbe 采样 GameFlow 子对象/类哈希、外壳菜单、当帧场景集合、输入上下文
;   与 PVP 专属实体名；ModeCallProbe dump 前端对象方法表（按 crc32 反查名字），
;   并按地址挂钩游戏模式管理器，用于定位"模式参数 / 模式对象"。都不改游戏内存。
ModeProbe=0
ModeCallProbe=0

; 可选菜单语言（逗号分隔，顺序即菜单中的选项顺序）。
; **留空/删掉** = 提供本版本内置的全部语言（当前是 zh-CN、en-US）。
Languages=zh-CN,en-US

; 模组菜单与插件窗口（含自绘聊天框）的界面缩放（按游戏分辨率自适应）：
;   MenuScale   = 0 表示按分辨率自动（高度/1080，4K 即 2.0）；
;                 >0 表示固定倍率（同样受 Min/Max 限制）
;   MenuScaleMin/Max = 最终缩放的上下限，自动和固定模式都受限
; 修改后重启游戏生效。基准：1080p 下为 1.0（与旧版外观一致）。
MenuScale=0
MenuScaleMin=0.75
MenuScaleMax=3.0

; 日志级别：none / error / warn / info / debug
;   它控制两件事 —— 哪些日志文件会被创建，以及每个文件里写多细：
;     info / debug  各模块自己的日志全都建（logs\ 里会有十几个文件）；
;     warn / error  只保留 logs\scripthook.log 与 logs\scripthook_crash.log；
;     none          同上，且地板之上不再写任何行（启动那两行仍会写）。
;   「地板」= logs\scripthook.log 里那几行无论级别一定会写的行：版本与构建时间，
;   以及各模块的**启动里程碑** —— 插件扫描计数、真实 dinput8 是否加载成功、
;   游戏第一次调用 DirectInput8Create 的返回值、覆盖层走了哪条路/是否起来、
;   playmode 是否挂上、文件层挂了多少个目标、corefix 档位是否全默认。
;   为什么它们要在任何级别都写：报障时最先要的就是这些，而它们在各自模块的
;   日志文件里（warn 下那些文件根本不建）。2026-09-17 那次公测黑屏反馈就是
;   因为没有这几行，整份日志只剩三行、无法判读。
;   要现场排查细节时，临时改成 debug 重启一次就能拿到全量诊断。
;   改完**下次启动**生效。插件自己的日志（plugins\<名>\<名>.log 等）由各插件
;   控制，不受这里影响。
; LogLevel=info

