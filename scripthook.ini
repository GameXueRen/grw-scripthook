 GRW ScriptHook 主配置文件，放在游戏根目录（与 GRW.exe、dinput8.dll 同级）
; 保存后下次启动生效。

[loader]
; 0 = 启动时不加载任何插件
load_plugins=1

; ---- CPU 调度：按游戏启动阶段分别设置 ----
; 每个阶段一个档位，取值：
;   0 = 不干涉：什么都不设置，交由系统调度（系统自己的自动优化也保留）
;   1 = 全部核心(强制)：强制使用本机全部处理器，用来覆盖系统的自动优化
;   2 = 禁超线程：每个物理核心只保留一个逻辑核心
;   3 = 禁小核：只保留大核 P-core（仅 Intel 12代+ 大小核；其它 CPU 不适用、不做改动）
;   4 = 禁超线程+小核
; 游玩阶段额外提供：5 = 仅禁CPU0，6 = 禁超线程+CPU0，7 = 禁小核+CPU0，8 = 三者全禁
;
; Logo 阶段：此阶段禁超线程可让 logo 界面秒进
cpu_boot=0
; 游戏窗口加载阶段（加载界面 / 主菜单 / 大厅）：
;   部分机器禁小核可秒进，另有机器（被 Win11 自动优化过）需要"全部核心(强制)"
cpu_window=0
; 游玩阶段：禁超线程 / 禁 CPU0 用于缓解游玩中的间歇性卡顿
cpu_play=0

; ---- 各阶段的进程 CPU 优先级 ----
; 取值：0=低 1=低于正常 2=不干涉 3=正常 4=高于正常 5=高（默认 2 = 不干涉）
;   Logo / 窗口加载阶段提供全部 6 档：加载时"让出机器"给其它程序也是一种选择
;   游玩阶段只提供 2=不干涉 3=正常 4=高于正常 5=高（低优先级游玩只会更卡）
;   不干涉 = 保持游戏自己的设置；到该阶段时还原成我们介入前的优先级
;   游戏启动时会自己设置优先级，设为非"不干涉"后由我们持续保持，不会被改回去
;   不提供"实时"：实时优先级可能让系统输入 / 音频卡顿
cpu_prio_boot=2
cpu_prio_window=2
cpu_prio_play=2

; 游玩阶段最大逻辑核心数（0～64，0 = 不限制）。
;   仅游玩阶段生效；启动阶段（Logo / 窗口加载）不做限制，避免影响游戏启动。
cpu_cores=0

; 1 = 开启泄漏探测心跳：渲染线程每 5 秒在日志输出一行 leak: 记录
;     （进程私有内存/工作集/页面文件 + UI widget/纹理 + 场景槽位计数），
;     用于长时间挂机排查内存是否单调增长。默认 0（关闭）。
; 关闭时每帧仅一次布尔判断，对性能无影响。
leak_probe=0

[plugins]
; 每个插件一行，按 plugins/ 下的文件夹名，0 = 禁用该插件。
; 文件夹名与 .asi 文件名必须一致：plugins/<name>/<name>.asi。
firstperson=1
fov_changer=1
spawner=1
skipintro=1
freecam=1

; 「最后的仪式」新 DLC 进图闪退的修复（LastRites_dlcfix 插件）。
;   已实测确认：游戏对该免费更新的授权查询条目为 3718，锁区版被答「未获得」
;   后在加载流程中解引用空指针而闪退。插件仅对 3718 答「已获得」，该条目号
;   写死在代码里、不可配置，其余条目（含全部付费 DLC）一律返回游戏原本的答案。
;   开关在模组菜单「最后的仪式」闪退修复里，默认关，关闭时不安装任何钩子；
;   改动于下次启动游戏时生效。
;   仅单机使用；官方修复推送后请关闭开关并删除 plugins/LastRites_dlcfix。
LastRites_dlcfix=1

test_plugin=0
chaos=0
CrazyCars=0
hitfling=0
Reinforcement=0
tp_roulette=0
tpgun=0
ui_sample=0

[Settings]
; 菜单语言
Language=zh_cn

; 可选菜单语言（逗号分隔，顺序即菜单中的选项顺序）。
Languages=zh_cn,en

; 模组菜单/聊天框的界面缩放（按游戏分辨率自适应）：
;   MenuScale   = 0 表示按分辨率自动（高度/1080，4K 即 2.0）；
;                 >0 表示固定倍率（同样受 Min/Max 限制）
;   MenuScaleMin/Max = 最终缩放的上下限，自动和固定模式都受限
; 修改后重启游戏生效。基准：1080p 下为 1.0（与旧版外观一致）。
MenuScale=0
MenuScaleMin=0.75
MenuScaleMax=3.0

; 日志级别（预留，尚未实现）：none / error / warn / info / debug
; LogLevel=info

; ------------------------------------------------------------
; [chat]：自绘聊天框（支持输入中文）
; 在“模组功能设置 → 自绘聊天框（支持输入中文）”菜单里配置，
; 修改后需重启游戏生效。
;   Enabled  = 1/0    功能总开关，默认 0（关闭）
;   StartKey = VK 键码 开始聊天键（需与游戏内文本聊天按键一致），默认 84 = T
;   CandMode = 0/1    0=自绘候选窗（默认） 1=输入法自带候选窗
; ------------------------------------------------------------
[chat]

; ------------------------------------------------------------
; [MenuOrder]：根菜单下各插件菜单的显示顺序。
; 键 = 菜单标题（插件 ShMenuCreate 传入的英文原文，如 "Vehicles"）
; 值 = 排序权重，数字越小越靠前。未列出的菜单权重默认 1000
; 未设置排序权重的按原有顺序排在已配置的后面
; ------------------------------------------------------------
[MenuOrder]
Mod settings = 0
Vehicles = 10
First person = 20
Field of view = 30
Time & Weather = 40
Skip intro videos = 50

