; GRW ScriptHook 主配置文件，放在游戏根目录（与 GRW.exe、dinput8.dll 同级）
; 保存后下次启动生效。

[loader]
; 0 = 启动时不加载任何插件
load_plugins=1

; 1 = 禁止小核（游戏仅调度使用大核，适配Intel 12代+），修复无限卡加载。默认 0（未启用）。
cpu_ecore_off=0

; 1 = 关闭超线程（游戏仅调度使用物理核心），默认 0（未启用）。
; 适用于任何 CPU（Intel、AMD、有无小核均可）。当游戏即使没有小核，只是开了超线程也会卡启动加载画面时使用。
; 与 cpu_ecore_off 同时为 1 时，效果为“游戏仅调度使用大核+物理核心”。
cpu_ht_off=0

; 可调度最大核心数上限（0 = 自动）
;   仅当 cpu_ecore_off=1 或 cpu_ht_off=1 时生效。
cpu_cores=0

[plugins]
; 每个插件一行，按 plugins/ 下的文件夹名，0 = 禁用该插件。
; 文件夹名与 .asi 文件名必须一致：plugins/<name>/<name>.asi。
firstperson=1
fov_changer=1
spawner=1
skipintro=1
freecam=1

test_plugin=0
chaos=0
CrazyCars=0
hitfling=0
Reinforcement=0
tp_roulette=0
tpgun=0
ui_sample=0

[Settings]
; 菜单语言
Language=zh_cn

; 可选菜单语言（逗号分隔，顺序即菜单中的选项顺序）。
Languages=zh_cn,en

; 日志级别（预留，尚未实现）：none / error / warn / info / debug
; LogLevel=info

; ------------------------------------------------------------
; [MenuOrder]：根菜单下各插件菜单的显示顺序。
; 键 = 菜单标题（插件 ShMenuCreate 传入的英文原文，如 "Vehicles"）
; 值 = 排序权重，数字越小越靠前。未列出的菜单权重默认 1000
; 未设置排序权重的按原有顺序排在已配置的后面
; ------------------------------------------------------------
[MenuOrder]
Mod settings = 0
Vehicles = 10
First person = 20
Field of view = 30
Time & Weather = 40
Skip intro videos = 50

; ------------------------------------------------------------
; [MenuHints]：给没有调用 ShMenuHint 的插件菜单（如第三方 .asi）配置顶部提示。
; 键 = 子菜单标题（插件 ShMenuCreate 传入的英文原文），值 = 提示文本英文原文。提示文本作为翻译 key，在对应的[zh_cn.<菜单标题>] 节里加同 key 翻译即可。
; ------------------------------------------------------------
[MenuHints]
Ammo Capacity = Changes apply after visiting an ammo crate.
Bullet Drop = Reduces bullet drop for all firearms.
Bullet Velocity = Raises bullet velocity for all firearms.
Day/Night Visibility = Not compatible with visual detection modifiers.
Equalize Enemy Health = Removes the extra damage resistance enemies get in combat.
Gunshot Detection = Adjust how far enemies can hear your gunfire.
Free camera = WASD 沿着视野移动，QE上下移动视野。按住Shift加速，按住Ctrl减速
Time & Weather = 实时改变游戏内的天气和时间

; ------------------------------------------------------------
; 翻译表：每个语言一个节（[Settings] 的 Language 决定用哪个），
; 另可按菜单细分 [语言.菜单标题]，让同一个英文词在不同菜单译法不同。
; 键 = 菜单标签原文，值 = 本地化文本。文件保存为 UTF-8。
; 注意：子节名里的 <菜单标题> 是菜单的显示标题（插件传给ShMenuCreate 的字符串），不是插件文件夹名。
; 更深层菜单用点分路径，如 [zh_cn.First person.Custom]，查找时逐级回退：[zh_cn.First person.Custom] -> [zh_cn.First person] -> [zh_cn]。
; ------------------------------------------------------------
