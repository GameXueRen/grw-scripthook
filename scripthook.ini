; 页面顶部提示不在这里配置：[MenuHints] 段已取消，改为文本键 "<页面键>.hint"，
; 写在 lang.ini 里（插件自己的 plugins\<名>\lang.ini 优先，其次 <gamedir>\lang.ini）。

; ------------------------------------------------------------
[playmode]
enabled=1
; ------------------------------------------------------------
; [forgemod]：Forge Mod Loader（游戏资源侧热替换）
;   把 mods\ 目录下的松散文件叠加到已有 .forge 条目上，不改动原版归档、不写盘。
;   目录规则（对齐 GRB Tweaks）：
;     mods\<归档名>\<文件>           扁平布局，优先级最高
;     mods\<mod名>\<归档名>\<文件>   按 mod 文件夹名升序，先者优先
;     mods\~<名字>\...               "~" 前缀 = 该 mod 被禁用
;     ...\<n>_-_<条目名>.data        文件名里的数字前缀指定条目
;   条目名不唯一，因此一律按 index（数字前缀）或 FileDataID 定位。
;   替换内容必须放得进该条目原有空间（不移动其它条目），否则会被拒绝并写日志。
;   改动需重启游戏生效。
; ------------------------------------------------------------
[forgemod]
enabled=0          ; 1 = 启用（默认关，避免影响正常游玩）
dry_run=0          ; 1 = 只解析并写日志，不实际叠加
strict=1           ; 1 = 放不下即拒绝并记录
report_copies=1    ; 1 = 检测同一资源在其它归档里的副本并写入日志
apply_all_copies=0 ; 1 = 把 mod 自动叠加到所有含该资源的归档
probe=0            ; 1 = 安装取证探针（排查用，与正式叠加互斥）
log_reads=0        ; 1 = 记录每次对已接管归档的读取（排查用）

; ---- Forge Mod Loader 菜单文案（译文在 <gamedir>\lang.ini 或编译期基线里） ----
; 状态行是 printf 模板：占位符必须原样保留，只译文字部分。
